name: echoline

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: echoline:web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-echoline}:${POSTGRES_PASSWORD:-echoline}@postgres:5432/${POSTGRES_DB:-echoline}}
      HOSTNAME: 0.0.0.0
      LOCAL_MEDIA_ROOT: ${LOCAL_MEDIA_ROOT:-/data/echoline/media}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_BASE_URL: ${OPENAI_TRANSCRIPTION_BASE_URL:-}
      PORT: "3000"
      RECORDINGS_BUCKET: ${RECORDINGS_BUCKET:-recordings}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASR_MODEL: ${ASR_MODEL:-gpt-4o-mini-transcribe}
      ASR_PROVIDER: ${ASR_PROVIDER:-openai}
      DICTIONARY_AI_BASE_URL: ${DICTIONARY_AI_BASE_URL:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
    volumes:
      - type: bind
        source: ${ECHOLINE_MEDIA_ROOT:-/data/echoline/media}
        target: /data/echoline/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echoline}
      POSTGRES_USER: ${POSTGRES_USER:-echoline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echoline}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echoline} -d ${POSTGRES_DB:-echoline}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    networks:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ECHOLINE_DOMAIN: ${ECHOLINE_DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks:
      - app

networks:
  app:

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
  redis-data:
